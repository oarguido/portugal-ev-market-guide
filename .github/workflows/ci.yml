name: Validação

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sem isto, `on: push` sem filtro mais `on: pull_request` davam duas execuções
# iguais por cada push num ramo com PR aberto, e um push novo não cancelava a
# execução que já era irrelevante.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar uv
        # Pin exato: o setup-uv não publica uma tag móvel `v9`, só `v9.0.0`.
        # Confirmei o release e assumi que a tag major existia — não existe, e o
        # pipeline falhou logo no primeiro arranque. O dependabot trata dos bumps.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `make verificar` é o alvo único: lint, frescura, compilação, testes e
      # ligações. Os alvos lint/validate/test deixaram de existir quando o
      # Makefile foi reduzido a três, e este workflow continuou a chamá-los —
      # falhou no primeiro arranque com "No rule to make target 'lint'".
      - name: Verificar
        run: make verificar

      - name: Confirmar bundle compilado
        run: git diff --exit-code -- web/assets/js/car_data.js
