name: Validação

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sem isto, `on: push` sem filtro mais `on: pull_request` davam duas execuções
# iguais por cada push num ramo com PR aberto, e um push novo não cancelava a
# execução que já era irrelevante.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Lint
        run: make lint

      - name: Validar e compilar dados
        run: make validate

      - name: Executar testes
        run: make test

      - name: Confirmar bundle compilado
        run: git diff --exit-code -- web/assets/js/car_data.js
